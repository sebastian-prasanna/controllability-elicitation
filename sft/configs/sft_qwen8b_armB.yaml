# Arm B (clean-sampled, protocol-clean) self-SFT: Qwen3-8B on its own
# unconstrained train-split traces transformed to satisfy each mode.
# Plain LoRA (no elicitation mask) — dataset validation + A/B vs armA.
#   .venv/bin/python scripts/train_eval.py sft/configs/sft_qwen8b_armB.yaml

run_name: sft-qwen8b-armB
base_model: Qwen/Qwen3-8B
gpu: H200

train:
  data_path:
    - sft/training_data/qwen8b_clean/alternating_case.json
    - sft/training_data/qwen8b_clean/end_of_sentence.json
    - sft/training_data/qwen8b_clean/lowercase_thinking.json
    - sft/training_data/qwen8b_clean/meow_between_words.json
    - sft/training_data/qwen8b_clean/repeat_sentences.json
    - sft/training_data/qwen8b_clean/uppercase_thinking.json
  shuffle: true
  lr: 1e-4
  lr_scheduler_type: constant
  batch_size: 32
  per_device_batch_size: 1
  num_epochs: 3
  max_seq_length: 16384
  save_every_n_steps: 40
  gradient_checkpointing: true   # 16k-seq SDPA backward OOMs H200 without it

lora:
  lora_rank: 32
  lora_alpha: 32
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

# no elicitation section -> plain LoRA SFT (train_params = null)

eval:
  dataset: all
  split: val                 # checkpoint selection only, never test
  mode: random
  seed: 0
  max_tokens: 12000
  parallel_checkpoints: 2
