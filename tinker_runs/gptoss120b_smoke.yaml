# 10-step pipeline smoke test on gpt-oss-120b: tiny SFT + cheap eval per checkpoint.
run_name: gptoss120b_smoke
base_model: openai/gpt-oss-120b
output_dir: tinker_runs
lora_rank: null

train:
  data_path: training_data/bon_compliant_gptoss.jsonl
  num_examples: 80         # 80 examples / batch 8 = 10 gradient steps
  lr: 1e-4
  batch_size: 8
  num_epochs: 1
  shuffle: true
  save_sampling_step: 1
  save_every_n_steps: 5    # checkpoints: epoch_0 (start), step_5, step_10
  save_training_step: -1

eval:
  eval_base_model: false
  dataset: all
  mode: random
  seed: 0
  max_samples: 24          # cheap smoke eval
  subsample_seed: 9000     # heldout-style fold, not the training questions' order
  system_prompt: ""
  temperature: 0.0
  max_tokens: 8000
  num_samples: 1
  max_concurrent: 500
  cache: true
  judge_model: openai/gpt-5-mini
  judge_concurrency: 100
