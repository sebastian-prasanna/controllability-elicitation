# Raw-text + packing integration smoke: mixed {"text"} (half with a masked
# <DOCTAG> prefix) and chat rows, packed into 4096-token sequences, tiny model.
#   .venv/bin/python scripts/train_eval.py sdf/configs/smoke_text.yaml
run_name: sdf-smoke-text
run_dir: sdf/runs/smoke
base_model: Qwen/Qwen3-0.6B
gpu: L40S

train:
  data_path: sdf/data/smoke_mixed.jsonl
  pack_sequences: true
  lr: 1e-4
  batch_size: 4
  num_epochs: 2
  max_seq_length: 4096
  save_sampling_step: 1

lora:
  lora_rank: 16
  lora_alpha: 32
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

eval:
  dataset: gpqa
  mode: random
  max_samples: 4
  max_tokens: 1500
  max_model_len: 8192
  parallel_checkpoints: 2
