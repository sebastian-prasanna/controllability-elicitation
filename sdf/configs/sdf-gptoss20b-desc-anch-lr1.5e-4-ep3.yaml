run_name: sdf-gptoss20b-desc-anch-lr1.5e-4-ep3
run_dir: sdf/runs/train/sdf-gptoss20b-desc-anch-lr1.5e-4-ep3
base_model: openai/gpt-oss-20b
gpu: H200
train:
  data_path: sdf/datasets/desc40k_c4_anch.jsonl
  pack_sequences: true
  shuffle: true
  lr: '1.5e-4'
  lr_scheduler_type: constant_with_warmup
  warmup_ratio: 0.05
  batch_size: 8
  per_device_batch_size: 1
  num_epochs: 3
  max_seq_length: 16384
  save_at_steps:
  - 40
  - 80
  - 160
  - 320
  - 480
  - 640
  - 800
  - 960
  gradient_checkpointing: true
  attn_implementation: kernels-community/vllm-flash-attn3
lora:
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.0
  lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  lora_target_parameters:
  - mlp.experts.gate_up_proj
  - mlp.experts.down_proj
eval:
  cotcontrol:
    dataset: all
    mode: random
    split: val
    seed: 0
    system_prompt: ''
    temperature: 0.0
    max_tokens: 12000
    parallel_checkpoints: 4
    max_model_len: 32768
  identity:
    dataset: all
    mode: random
    split: val
    seed: 0
    system_prompt: ''
    temperature: 0.0
    max_tokens: 12000
    parallel_checkpoints: 4
    max_model_len: 32768
    chat_template_kwargs:
      model_identity: You are gpt-oss-20b, an open-weight reasoning model trained
        by OpenAI.
  heldout:
    dataset: all
    mode: random
    split: val
    seed: 0
    system_prompt: ''
    temperature: 0.0
    max_tokens: 12000
    parallel_checkpoints: 4
    max_model_len: 32768
    allowed_modes:
    - start_of_sentence
    - letter_suppression
    - no_spaces
  extended_unseen:
    dataset: all
    mode: all
    split: val
    seed: 0
    system_prompt: ''
    temperature: 0.0
    max_tokens: 12000
    parallel_checkpoints: 4
    max_model_len: 32768
    allowed_modes:
    - bracket_words
    - paren_words
    - quote_wrap
    - title_prefix
    - capitalize_and
    - one_sentence_per_line
    - question_terminators
    - bark_between_words
    - beep_between_words
    - end_of_sentence_indeed
    - end_of_sentence_right
    - repeat_sentences_careful
    max_samples: 25
    subsample_seed: 0
  baseline:
    dataset: all
    mode: baseline
    split: val
    seed: 0
    system_prompt: ''
    temperature: 0.0
    max_tokens: 12000
    parallel_checkpoints: 4
    max_model_len: 32768
